<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timeline console</title><link rel="stylesheet" href="/assets/app.css"><script src="/assets/app.js" defer></script></head>
<body><div id="login" class="login"><div class="login-card"><div class="mark">t.</div><p class="eyebrow">YOUR TIMELINE PROVIDER</p><h1>A place for<br>the record.</h1><p class="muted">Manage timelines, publish entries, and control who can read them.</p><form id="login-form"><label for="password">Console password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Open console <span>→</span></button></form><p id="login-error" role="alert"></p></div><p class="login-foot">Blue Coordination · Signed, timestamped records</p></div>
<div id="shell" hidden><aside><a class="brand" href="#overview"><span class="mark">t.</span><span>Timeline<br><small>PROVIDER CONSOLE</small></span></a><nav aria-label="Main"><a href="#overview" data-nav="overview">Overview</a><a href="#timelines" data-nav="timelines">Timelines <span id="timeline-count"></span></a><a href="#access" data-nav="access">Timeline access <span id="access-count"></span></a></nav><div class="aside-bottom"><span class="status-dot"></span> Owner workspace<button class="text-button" id="logout">Log out ↗</button></div></aside><main><header><span id="breadcrumb">Workspace / Overview</span><span class="owner-badge">● Owner</span></header><div id="notice" role="status" hidden></div><div id="content" aria-live="polite"></div></main></div>
<dialog id="editor"><form id="editor-form"><div class="dialog-heading"><h2 id="editor-title"></h2><button class="icon" type="button" id="close-editor" aria-label="Close">×</button></div><div id="editor-fields"></div><p id="editor-error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary" id="cancel-editor">Cancel</button><button type="submit" id="save-editor">Save</button></div></form></dialog>
<dialog id="inspector"><div class="dialog-heading"><h2>Blue object</h2><button class="icon" id="close-inspector" aria-label="Close">×</button></div><p class="mono" id="object-id"></p><section id="object-provider" class="provider-profile" hidden></section><pre id="object-body"></pre><button class="secondary" id="copy-object">Copy JSON</button></dialog>
</body></html>
